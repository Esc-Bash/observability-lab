# Inventory service for the final project (topic 20). Not part of k8s/shop/ until then:
# the topic 20 setup script copies this file to k8s/shop/inventory.yaml and applies it.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: inventory
  namespace: shop
  labels:
    app: inventory
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: inventory
  template:
    metadata:
      labels:
        app: inventory
    spec:
      terminationGracePeriodSeconds: 5
      containers:
        - name: inventory
          image: ghcr.io/esc-bash/shop-inventory:v1
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8002
          env:
            - name: STOCK_SERVICE_TIMEOUT_MS
              value: "2000"
          readinessProbe:
            httpGet:
              path: /health
              port: 8002
            periodSeconds: 5
          resources:
            requests:
              cpu: 20m
              memory: 48Mi
            limits:
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: inventory
  namespace: shop
  labels:
    app: inventory
spec:
  selector:
    app: inventory
  ports:
    - name: http
      port: 8002
      targetPort: 8002
