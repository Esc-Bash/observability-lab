apiVersion: v1
kind: ConfigMap
metadata:
  name: loki-config
  namespace: monitoring
data:
  loki.yaml: |
    # Loki 3 single binary, all data in the pod (emptyDir), no login.
    auth_enabled: false

    server:
      http_listen_port: 3100
      grpc_listen_port: 9096
      log_level: warn

    common:
      instance_addr: 127.0.0.1
      path_prefix: /loki
      replication_factor: 1
      storage:
        filesystem:
          chunks_directory: /loki/chunks
          rules_directory: /loki/rules
      ring:
        kvstore:
          store: inmemory

    schema_config:
      configs:
        - from: "2024-01-01"
          store: tsdb
          object_store: filesystem
          schema: v13
          index:
            prefix: index_
            period: 24h

    ingester:
      lifecycler:
        min_ready_duration: 0s

    limits_config:
      # OTLP logs (POST /otlp/v1/logs): resource attribute service.name becomes the label
      # service_name; trace_id, span_id and other attributes are kept as structured metadata.
      allow_structured_metadata: true
      volume_enabled: true
      retention_period: 24h
      reject_old_samples: true
      reject_old_samples_max_age: 24h

    query_range:
      results_cache:
        cache:
          embedded_cache:
            enabled: true
            max_size_mb: 32

    chunk_store_config:
      chunk_cache_config:
        embedded_cache:
          enabled: true
          max_size_mb: 32

    pattern_ingester:
      enabled: false

    analytics:
      reporting_enabled: false
