# Sample exporter for topic 06: kubectl apply -f demo/exporter.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sample-exporter
  namespace: default
  labels:
    app: sample-exporter
spec:
  replicas: 1
  selector:
    matchLabels:
      app: sample-exporter
  template:
    metadata:
      labels:
        app: sample-exporter
    spec:
      containers:
        - name: sample-exporter
          image: ghcr.io/esc-bash/sample-exporter:v1
          imagePullPolicy: IfNotPresent
          ports:
            - name: metrics
              containerPort: 9200
          readinessProbe:
            httpGet:
              path: /metrics
              port: 9200
            periodSeconds: 5
          resources:
            requests:
              cpu: 5m
              memory: 24Mi
            limits:
              memory: 96Mi
---
apiVersion: v1
kind: Service
metadata:
  name: sample-exporter
  namespace: default
  labels:
    app: sample-exporter
spec:
  selector:
    app: sample-exporter
  ports:
    - name: metrics
      port: 9200
      targetPort: 9200
